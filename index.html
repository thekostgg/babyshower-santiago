<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Shower de Santiago</title>
<meta name="description" content="Marcia y Ángel te invitan al baby shower de Santiago. Sábado 12 de diciembre de 2026, 17:00 hrs.">
<meta property="og:title" content="Baby Shower de Santiago">
<meta property="og:description" content="La vida está por volverse un poquito más dulce… Sábado 12 de diciembre, 17:00 hrs.">
<meta property="og:image" content="assets/gen/compartir.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#acddf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/gen/p0_sello.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="cerrado">
  <div id="cargando" aria-hidden="true"><div class="gota"></div></div>
  <script>setTimeout(function(){var c=document.getElementById('cargando');if(c)c.className='fuera';},7000);</script>

  <section id="intro" aria-label="Sobre de la invitación"></section>
  <main id="inv" aria-label="Invitación"></main>
  <div id="hojas" aria-hidden="true"></div>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="m-titulo" hidden>
    <div class="m-caja">
      <button class="m-cerrar" type="button" aria-label="Cerrar">×</button>
      <h2 id="m-titulo">Confirmar asistencia</h2>
      <p class="m-sub">Tu compañía hará este día todavía más dulce.</p>
      <form id="f-confirmar" novalidate>
        <label class="m-et" for="f-nombre">Nombre del invitado</label>
        <input id="f-nombre" name="nombre" maxlength="80" autocomplete="name" placeholder="Escribe tu nombre">
        <p class="m-et">¿Podrás acompañarnos?</p>
        <label class="op"><input type="radio" name="asiste" value="si"> Sí, asistiré.</label>
        <label class="op"><input type="radio" name="asiste" value="no"> No podré asistir.</label>
        <p class="m-error" role="alert"></p>
        <div class="m-botones"></div>
        <p class="m-nota">Se abrirá WhatsApp con tu mensaje listo. Recuerda pulsar «Enviar» dentro de WhatsApp. Puedes enviarlo a uno o a ambos.</p>
      </form>
    </div>
  </div>

  <div id="aviso" role="status" hidden></div>

  <script src="config.js?v=4"></script>
  <script src="assets/gen/manifest.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
